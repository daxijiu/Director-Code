name: insider-macos

on:
  workflow_dispatch:
  repository_dispatch:
    types: [insider]
  push:
    branches: [ insider ]
    paths-ignore:
      - '**/*.md'
      - 'upstream/*.json'
  pull_request:
    branches: [ insider ]
    paths-ignore:
      - '**/*.md'

env:
  P1_PROFILE: docs/upgrade/profiles/112-stable-win32-x64-client.json
  VSCODE_QUALITY: insider
  OS_NAME: macos
  VSCODE_ARCH: x64
  VSCODE_DIR: ${{ github.workspace }}/vscode.generated/layers/director/vscode
  ARTIFACTS_OUT: ${{ github.workspace }}/artifacts/out/insider/darwin-x64/source
  DRY_RUN: offline

jobs:
  p1-replay-baseline:
    name: P1 replay baseline guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Validate replay metadata
        shell: bash
        run: node scripts/upgrade/validate-all.mjs

      - name: Check workflow and doc migration
        shell: bash
        run: node scripts/upgrade/check-workflows.mjs

      - name: Materialize generated source
        shell: bash
        run: |
          bash scripts/upgrade/materialize-vscode.sh \
            --profile "${P1_PROFILE}" \
            --target vscode.generated \
            --up-to-layer director \
            --force

      - name: Assert canonical paths
        shell: bash
        run: |
          test -d "${VSCODE_DIR}"
          mkdir -p "${ARTIFACTS_OUT}"
          test "${DRY_RUN}" = "offline"
