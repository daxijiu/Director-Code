name: GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pages.yml"
      - "docs/.nojekyll"
      - "docs/terms/**"
      - "docs/privacy/**"
      - "docs/public-code/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage Pages Content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp docs/.nojekyll _site/.nojekyll
          cp -R docs/terms _site/terms
          cp -R docs/privacy _site/privacy
          cp -R docs/public-code _site/public-code

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
